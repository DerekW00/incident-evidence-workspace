<div id="activity" {% if run.status == 'queued' or run.status == 'running' %}hx-get="{% url 'events' run.id %}" hx-trigger="every 3s" hx-swap="outerHTML"{% endif %}><div class="section-heading"><h2>Activity</h2><span class="pill">{{ run.status }}</span></div>{% for event in run.events.all %}<p class="event"><b>{{ event.sequence|stringformat:"02d" }}</b> {{ event.text }}</p>{% endfor %}{% if run.status == 'completed' %}<p class="muted">Saved findings ready. <a href="{% url 'run' run.id %}">Refresh full workspace →</a></p>{% endif %}</div>
